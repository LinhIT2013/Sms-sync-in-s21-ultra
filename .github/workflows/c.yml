          package com.lcn.smssyncmobile

          import android.content.Context

          object SyncPrefs {
              private const val PREF_NAME = "oneui_sms_sync_prefs"
              private const val KEY_AUTO_SYNC = "is_auto_sync_enabled"

              fun isAutoSync(context: Context): Boolean {
                  val prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                  return prefs.getBoolean(KEY_AUTO_SYNC, true)
              }

              fun setAutoSync(context: Context, enabled: Boolean) {
                  val prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                  prefs.edit().putBoolean(KEY_AUTO_SYNC, enabled).apply()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/lcn/smssyncmobile/SmsSyncWorker.kt
          package com.lcn.smssyncmobile

          import android.content.Context
          import android.os.Build
          import androidx.work.Worker
          import androidx.work.WorkerParameters
          import com.google.android.gms.tasks.Tasks
          import com.google.firebase.auth.FirebaseAuth
          import com.google.firebase.firestore.FirebaseFirestore

          class SmsSyncWorker(context: Context, params: WorkerParameters) : Worker(context, params) {
              override fun doWork(): Result {
                  val uid = FirebaseAuth.getInstance().currentUser?.uid ?: return Result.failure()
                  val sender = inputData.getString("sender") ?: return Result.failure()
                  val body = inputData.getString("body") ?: return Result.failure()
                  val timestamp = inputData.getLong("timestamp", System.currentTimeMillis())

                  val docId = "${timestamp}_${sender.hashCode()}"
                  val smsData = hashMapOf(
                      "sender" to sender,
                      "body" to body,
                      "timestamp" to timestamp,
                      "deviceModel" to "${Build.MANUFACTURER} ${Build.MODEL}",
                      "syncedAt" to System.currentTimeMillis()
                  )

                  return try {
                      val task = FirebaseFirestore.getInstance()
                          .collection("users")
                          .document(uid)
                          .collection("sms_list")
                          .document(docId)
                          .set(smsData)
                      Tasks.await(task)
                      Result.success()
                  } catch (e: Exception) {
                      Result.retry()
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/lcn/smssyncmobile/SmsReceiver.kt
          package com.lcn.smssyncmobile

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.provider.Telephony
          import androidx.work.Constraints
          import androidx.work.NetworkType
          import androidx.work.OneTimeWorkRequestBuilder
          import androidx.work.WorkManager
          import androidx.work.workDataOf

          class SmsReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  if (!SyncPrefs.isAutoSync(context)) return

                  if (intent.action == Telephony.Sms.Intents.SMS_RECEIVED_ACTION) {
                      val messages = Telephony.Sms.Intents.getMessagesFromIntent(intent)
                      if (messages.isNullOrEmpty()) return

                      val sender = messages[0].originatingAddress ?: "Unknown"
                      val timestamp = messages[0].timestampMillis
                      val fullBody = StringBuilder()
                      for (sms in messages) {
                          fullBody.append(sms.messageBody)
                      }

                      val data = workDataOf(
                          "sender" to sender,
                          "body" to fullBody.toString(),
                          "timestamp" to timestamp
                      )

                      val constraints = Constraints.Builder()
                          .setRequiredNetworkType(NetworkType.CONNECTED)
                          .build()

                      val syncRequest = OneTimeWorkRequestBuilder<SmsSyncWorker>()
                          .setInputData(data)
                          .setConstraints(constraints)
                          .build()

                      WorkManager.getInstance(context).enqueue(syncRequest)
                  }
              }
          }
          EOF

