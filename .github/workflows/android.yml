name: Build APK & Get SHA-1

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên web GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Tạo Keystore & Lấy mã SHA-1 (Xem ở phần Log này)
        run: |
          if [ ! -f app/lcn_release.jks ]; then
            keytool -genkeypair -v \
              -keystore app/lcn_release.jks \
              -alias lcn_key \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass 123456 -keypass 123456 \
              -dname "CN=Linh Cong Nghe, OU=LCN, O=LCN, L=NinhBinh, S=NB, C=VN"
          fi
          echo "=========================================="
          echo "MÃ SHA-1 CỦA BẠN ĐỂ DÁN VÀO FIREBASE LÀ:"
          keytool -list -v -keystore app/lcn_release.jks -alias lcn_key -storepass 123456 | grep "SHA1:"
          echo "=========================================="

      - name: 4. Tải file Keystore về để lưu cố định vào Repo
        uses: actions/upload-artifact@v4
        with:
          name: Keystore-Co-Dinh
          path: app/lcn_release.jks

      - name: 5. Cấp quyền và Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 6. Tải file APK hoàn chỉnh
        uses: actions/upload-artifact@v4
        with:
          name: SMS-Sync-OneUI-APK
          path: app/build/outputs/apk/debug/*.apk
          
