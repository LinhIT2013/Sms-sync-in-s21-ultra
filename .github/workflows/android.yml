name: Build and Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix and Generate Gradle Wrapper
        run: |
          # Xóa các file wrapper cũ bị lỗi nếu có
          rm -rf gradle/wrapper
          
          # Tự động tạo lại Gradle Wrapper sạch sẽ phiên bản 8.5
          gradle wrapper --gradle-version 8.5
          
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Generate Version Tag
        id: version
        run: |
          VERSION="v1.0.$(date +%Y%m%d%H%M%S)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build Release AAB
        run: ./gradlew bundleRelease
        env:
          MYAPP_RELEASE_STORE_FILE: lcn_release.jks
          MYAPP_RELEASE_STORE_PASSWORD: "123456"
          MYAPP_RELEASE_KEY_ALIAS: "lcn_key"
          MYAPP_RELEASE_KEY_PASSWORD: "123456"
          
      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "Đồng Bộ SMS APK - ${{ env.VERSION }}"
          body: |
            🤖 **Bản dựng tự động (Automatic Build)**
            - Ứng dụng đồng bộ SMS giao diện Samsung One UI.
            - Bấm vào file `.apk` bên dưới để tải về cài đặt trực tiếp.
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
