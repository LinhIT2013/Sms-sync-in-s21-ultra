name: Build SMS Sync APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Tự động tạo Gradle Wrapper (gradlew) nếu chưa có
        run: |
          if [ ! -f gradlew ]; then
            echo "Đang tạo Gradle Wrapper..."
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: 4. Build APK bằng Gradle
        run: ./gradlew assembleDebug

      - name: 5. Xuất file APK hoàn chỉnh
        uses: actions/upload-artifact@v4
        with:
          name: Dong-Bo-SMS-APK
          path: app/build/outputs/apk/debug/*.apk
          
