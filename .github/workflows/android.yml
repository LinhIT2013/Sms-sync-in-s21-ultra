name: Build APK & Get SHA-1

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write # Cho phép GitHub Actions tự động lưu file Keystore vào thẳng Repo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Tạo thư mục app, tạo Keystore & In mã SHA-1
        run: |
          mkdir -p app
          if [ ! -f app/lcn_release.jks ]; then
            keytool -genkeypair -v \
              -keystore app/lcn_release.jks \
              -alias lcn_key \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass 123456 -keypass 123456 \
              -dname "CN=Linh Cong Nghe, OU=LCN, O=LCN, L=NinhBinh, S=NB, C=VN"
            
            # Tự động lưu vĩnh viễn file lcn_release.jks vào thẳng nhánh GitHub của bạn
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/lcn_release.jks
            git commit -m "Tự động tạo và lưu cố định Keystore lcn_release.jks" || true
            git push || true
          fi
          echo "=========================================================="
          echo "MÃ SHA-1 CỦA BẠN ĐỂ COPY DÁN VÀO FIREBASE LÀ:"
          keytool -list -v -keystore app/lcn_release.jks -alias lcn_key -storepass 123456 | grep "SHA1:"
          echo "=========================================================="

      - name: 4. Build APK (Chỉ chạy khi bạn đã đưa code lên)
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Đã tạo xong Keystore và lấy được SHA-1! Hãy thêm các file code để bắt đầu build APK."
          fi

      - name: 5. Tải file APK hoàn chỉnh
        if: hashFiles('app/build/outputs/apk/debug/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: SMS-Sync-OneUI-APK
          path: app/build/outputs/apk/debug/*.apk
          
