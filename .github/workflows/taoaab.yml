name: Build Android App Bundle (AAB)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Đã gộp tính năng quản lý bộ nhớ đệm (cache) vào hành động Setup Gradle ở dưới để tránh xung đột cấu hình
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0'

      # ĐÃ XÓA BƯỚC CHMOD GRADLEW: Vì bạn dùng lệnh 'gradle bundleRelease' hệ thống của máy ảo, 
      # bước kiểm tra quyền file gradlew này không còn cần thiết và sẽ gây lỗi "No such file" nếu cố chạy.

      # Đã sửa đường dẫn giải mã: Ghi thẳng file Keystore vào thư mục gốc của dự án (máy ảo đứng ở đây)
      - name: Decode Keystore file
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > lcn_release.jks

      # Đã sửa lại tên biến môi trường MYAPP_RELEASE_STORE_FILE thành lcn_release.jks cho đồng bộ với bước trên
      - name: Build Release AAB
        run: gradle bundleRelease
        env:
          MYAPP_RELEASE_STORE_FILE: lcn_release.jks
          MYAPP_RELEASE_STORE_PASSWORD: "123456"
          MYAPP_RELEASE_KEY_ALIAS: "lcn_key"
          MYAPP_RELEASE_KEY_PASSWORD: "123456"

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 7
